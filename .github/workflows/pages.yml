# Web版を GitHub Pages に公開する（main に push したとき、または手動で実行したとき）
# 事前に、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TSシミュレーター
    steps:
      - uses: actions/checkout@v4

      - name: Rust（rust-toolchain.toml の版）
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: TSシミュレーター

      - name: wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TSシミュレーター/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build（Web版）
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: TSシミュレーター/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
